<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC Camera Stream</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        
        h1 {
            margin-bottom: 20px;
            color: #4CAF50;
        }
        
        #videoContainer {
            position: relative;
            max-width: 100%;
            border: 2px solid #4CAF50;
            border-radius: 8px;
            overflow: hidden;
        }
        
        #remoteVideo {
            width: 100%;
            max-width: 800px;
            height: auto;
            display: block;
        }
        
        #status {
            margin-top: 20px;
            padding: 10px;
            background: #333;
            border-radius: 4px;
            text-align: center;
        }
        
        .connecting {
            color: #FFC107;
        }
        
        .connected {
            color: #4CAF50;
        }
        
        .error {
            color: #F44336;
        }
    </style>
</head>
<body>
    <h1>📹 Camera Stream</h1>
    <div id="videoContainer">
        <video id="remoteVideo" autoplay muted playsinline></video>
    </div>
    <div id="status" class="connecting">🔄 Connecting to camera...</div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script>
        // Get device ID from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const deviceId = urlParams.get('device') || 'default';
        const statusDiv = document.getElementById('status');
        const remoteVideo = document.getElementById('remoteVideo');

        // Firebase configuration - Use the correct project config
        const firebaseConfig = {
            apiKey: "AIzaSyBboyztZNPw9V0BXVa7rPeEWNUO8ZtvP-8",
            authDomain: "rutag-app.firebaseapp.com",
            projectId: "rutag-app",
            storageBucket: "rutag-app.firebasestorage.app",
            messagingSenderId: "411882758714",
            appId: "1:411882758714:web:ddbb17cdd970a5ec32cb03",
            databaseURL: "https://rutag-app-default-rtdb.asia-southeast1.firebasedatabase.app"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        
        // Initialize WebRTC directly without authentication
        initializeWebRTC(database);

        function initializeWebRTC(database) {
            // WebRTC configuration
            const pc = new RTCPeerConnection({
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' }
                ]
            });

            // Generate session ID
            const sessionId = 'web_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            
            // Set up WebRTC
            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    database.ref(`webrtc_sessions/${sessionId}/ice_candidates`).push({
                        candidate: event.candidate.candidate,
                        sdpMLineIndex: event.candidate.sdpMLineIndex,
                        sdpMid: event.candidate.sdpMid,
                        from: 'browser',
                        timestamp: Date.now()
                    });
                }
            };

            pc.ontrack = (event) => {
                console.log('Received remote stream');
                remoteVideo.srcObject = event.streams[0];
                statusDiv.className = 'connected';
                statusDiv.innerHTML = '✅ Connected to camera feed';
            };

            pc.onconnectionstatechange = () => {
                console.log('Connection state:', pc.connectionState);
                if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') {
                    statusDiv.className = 'error';
                    statusDiv.innerHTML = '❌ Connection lost. Refresh to retry.';
                }
            };

            // Listen for answers and ICE candidates from Pi
            database.ref(`webrtc_sessions/${sessionId}/answer`).on('value', async (snapshot) => {
                const answer = snapshot.val();
                if (answer && answer.data && pc.signalingState === 'have-local-offer') {
                    await pc.setRemoteDescription(new RTCSessionDescription(answer.data));
                    console.log('Answer set');
                }
            });

            database.ref(`webrtc_sessions/${sessionId}/ice_candidates_from_pi`).on('child_added', async (snapshot) => {
                const candidate = snapshot.val();
                if (candidate && pc.remoteDescription) {
                    await pc.addIceCandidate(new RTCIceCandidate({
                        candidate: candidate.candidate,
                        sdpMLineIndex: candidate.sdpMLineIndex,
                        sdpMid: candidate.sdpMid,
                    }));
                    console.log('Added ICE candidate from Pi');
                }
            });

            // Start connection
            startConnection(pc, database, sessionId);

            // Cleanup on page unload
            window.addEventListener('beforeunload', () => {
                pc.close();
                database.ref(`webrtc_sessions/${sessionId}`).remove();
            });
        }

        // Start connection
        async function startConnection(pc, database, sessionId) {
            try {
                // Create offer
                pc.addTransceiver('video', { direction: 'recvonly' });
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);

                // Create session record in the shape expected by the Pi server
                await database.ref(`webrtc_sessions/${sessionId}`).set({
                    deviceId,
                    createdAt: Date.now(),
                    offer: {
                        type: 'offer',
                        data: {
                            type: offer.type,
                            sdp: offer.sdp,
                        },
                        from: 'browser',
                        timestamp: Date.now(),
                    },
                });

                console.log('Offer sent to Pi');
                statusDiv.innerHTML = '📡 Waiting for camera response...';
                
                // Set timeout for connection
                setTimeout(() => {
                    if (pc.connectionState !== 'connected') {
                        statusDiv.className = 'error';
                        statusDiv.innerHTML = '⏱️ Connection timeout. Make sure camera is online.';
                    }
                }, 10000);

            } catch (error) {
                console.error('Error starting connection:', error);
                statusDiv.className = 'error';
                statusDiv.innerHTML = '❌ Failed to connect: ' + error.message;
            }
        }
    </script>
</body>
</html>
